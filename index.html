<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Domux — Tu hogar, organizado</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Domux es una app colaborativa para administrar tareas, gastos, rutinas y despensa del hogar en un solo lugar."
    />
    <meta
      name="keywords"
      content="Domux, hogar, tareas, gastos compartidos, administración del hogar, organización familiar, app hogar, rutinas, despensa"
    />
    <meta name="author" content="Domux" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#5c7cfa" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/domux-favicon.png" />
    <link rel="apple-touch-icon" href="/img/domux-favicon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Domux" />

    <meta property="og:title" content="Domux — Tu hogar, organizado" />
    <meta
      property="og:description"
      content="Organiza tareas, gastos y rutinas del hogar en equipo desde una sola app."
    />

    <!-- Cambia esto por tu dominio real -->
    <meta property="og:url" content="https://domux.vercel.app" />

    <!-- Imagen para compartir -->
    <meta property="og:image" content="https://domux.vercel.app/img/domux-concept.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Domux app preview" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Domux — Tu hogar, organizado" />
    <meta
      name="twitter:description"
      content="Organiza tareas, gastos y rutinas del hogar en equipo desde una sola app."
    />
    <meta name="twitter:image" content="https://domux.vercel.app/img/domux-concept.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://domux.vercel.app" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
